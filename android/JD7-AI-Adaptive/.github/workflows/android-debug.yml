name: JD7 Android Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/JD7-AI-Adaptive/**'

permissions:
  contents: read

env:
  GRADLE_VERSION: '9.5'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/JD7-AI-Adaptive

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jd7-ai-adaptive-v0.1-debug
          path: android/JD7-AI-Adaptive/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
